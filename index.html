<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz in Classe</title>
<style>
:root{--bg:#eef2f6;--fg:#14213d;--card:#fff;--mut:#5b6678;--pri:#14213d;--c0:#d7263d;--c1:#1b5fd1;--c2:#f2a900;--c3:#178a4b;--ok:#178a4b;--ko:#d7263d}
@media(prefers-color-scheme:dark){:root{--bg:#0f1624;--fg:#eef2f6;--card:#1b2538;--mut:#9aa5b8;--pri:#eef2f6}}
*{box-sizing:border-box}
body{margin:0;font:19px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg);min-height:100vh}
h1{font-size:2.1rem;margin:.2em 0 .4em}h2{font-size:1.25rem;margin:0 0 .6em}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:14px;padding:18px;margin:0 0 14px;border:1px solid rgba(128,128,128,.25)}
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:14px 22px;background:var(--pri);color:var(--bg);cursor:pointer;margin:4px 6px 4px 0}
.btn.s{background:transparent;color:var(--fg);border:2px solid var(--fg)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,.o:focus-visible{outline:4px solid #f2a900;outline-offset:2px}
label{display:block;margin:.5em 0}input[type=text],input[type=number]{font:inherit;padding:12px;border-radius:10px;border:2px solid var(--mut);background:var(--card);color:var(--fg);width:100%;max-width:340px}
input[type=number]{width:90px}input[type=radio],input[type=checkbox]{width:20px;height:20px;vertical-align:-3px;margin-right:8px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;font-size:1.1rem}
.tm{font-size:2.4rem;font-weight:800;min-width:60px;text-align:center}
.q{font-size:1.9rem;font-weight:700;line-height:1.25}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.opt{display:flex;align-items:center;gap:14px;padding:18px;border-radius:14px;color:#fff;font-size:1.35rem;font-weight:600;min-height:90px}
.opt b{font-size:2.2rem;min-width:40px}.opt span{flex:1}.opt em{font-style:normal;font-size:1.8rem;font-weight:800}
.c0{background:var(--c0)}.c1{background:var(--c1)}.c2{background:var(--c2);color:#14213d}.c3{background:var(--c3)}
.dim{opacity:.28}.ok{outline:6px solid var(--fg)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{padding:6px 14px;border-radius:99px;background:rgba(128,128,128,.25);color:var(--mut)}
.chip.d{background:var(--ok);color:#fff;font-weight:700}.chip.off{text-decoration:line-through;opacity:.5}
.lb{width:100%;border-collapse:collapse}.lb td{padding:8px 6px;border-bottom:1px solid rgba(128,128,128,.25)}.lb td:last-child{text-align:right;font-weight:800}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.ov .card{max-width:520px;width:100%;max-height:90vh;overflow:auto}
.code{font-size:3rem;font-weight:800;letter-spacing:.2em}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.warn{color:#b45309}.mut{color:var(--mut)}.err{color:var(--ko);font-weight:700}
.st{max-width:560px;margin:0 auto;padding:14px;text-align:center}
.st .big{font-size:2.2rem;font-weight:800;margin:.4em 0}
.sq{display:grid;grid-template-columns:1fr 1fr;gap:12px;height:calc(100vh - 150px);min-height:300px}
.sq .o{font-size:4.5rem;font-weight:800;justify-content:center}
.o{border:0;border-radius:16px;color:#fff;font:inherit;cursor:pointer;display:flex;align-items:center;gap:14px;padding:16px;text-align:left;font-size:1.3rem;font-weight:600}
.lst .o{width:100%;margin-bottom:12px;min-height:84px}.lst .o b{font-size:2.2rem;min-width:38px}
.o.c2{color:#14213d}
.res{border-radius:16px;padding:22px;color:#fff;margin:12px 0}
.conn{background:#b45309;color:#fff;padding:8px;text-align:center;font-weight:700}
@media(max-width:700px){.opts{grid-template-columns:1fr}.q{font-size:1.4rem}}
@media(prefers-reduced-motion:no-preference){.res{animation:p .35s}@keyframes p{from{transform:scale(.94);opacity:0}}}
</style></head><body>
<div id="cn"></div><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
// Per reti difficili (scuole/aziende) puoi aggiungere un server TURN: ice:[{urls:'stun:stun.l.google.com:19302'},{urls:'turn:...',username:'..',credential:'..'}]
const CFG={prefix:'kqz-',ice:null};
const $=s=>document.querySelector(s),app=$('#app'),L='ABCD';
const h=x=>{app.innerHTML=x},esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const mkPeer=id=>new Peer(id,CFG.ice?{config:{iceServers:CFG.ice}}:{});

/* ---------- PARSER ---------- */
function parse(txt){
 const qs=[],warn=[];let cur=null,last='';
 const push=()=>{if(!cur)return;
  if(cur.o.length<2)warn.push(`Domanda ${cur.n}: servono almeno 2 risposte (trovate ${cur.o.length}), saltata.`);
  else{if(cur.o.length>4){warn.push(`Domanda ${cur.n}: più di 4 risposte, uso solo le prime 4.`);cur.o=cur.o.slice(0,4)}
   else if(cur.o.length<4)warn.push(`Domanda ${cur.n}: ha solo ${cur.o.length} risposte.`);
   qs.push({q:cur.q.trim(),o:cur.o.map(x=>x.trim())})}
  cur=null};
 for(const raw of txt.replace(/^\uFEFF/,'').split(/\r?\n/)){
  const l=raw.trim();if(!l)continue;let m;
  if((m=l.match(/^(\d+)\s*[\)\.]\s*(.*)$/))){push();cur={n:m[1],q:m[2],o:[]};last='q'}
  else if(cur&&(m=l.match(/^([a-dA-D])\s*[\.\)]\s*(.*)$/))){cur.o.push(m[2]);last='o'}
  else if(cur){if(last==='q')cur.q+=' '+l;else if(cur.o.length)cur.o[cur.o.length-1]+=' '+l}
 }
 push();return{qs,warn}}

/* ---------- ISTRUTTORE ---------- */
const H={qs:[],warn:[],set:{timed:true,sec:20,speed:true,opts:true,shuf:false},players:new Map(),phase:'setup',qi:-1,order:[],cur:null,tm:null,lb:0,code:''};
const board=()=>[...H.players.values()].sort((a,b)=>b.score-a.score||b.right-a.right);
const refresh=()=>{if(H.phase!=='setup')render()};

function rSetup(){const s=H.set;
 h(`<div class=wrap><h1>Quiz in Classe</h1>
 <div class=card><h2>1. Carica le domande (file .txt)</h2><input type=file accept=".txt,text/plain" onchange="loadF(this.files[0])">
 <div style="margin-top:10px">${H.qs.length?`<b>${H.qs.length} domande riconosciute.</b> Esempio: «${esc(H.qs[0].q)}» (risposta giusta: ${esc(H.qs[0].o[0])})`:'<span class=mut>Nessun file caricato.</span>'}
 ${H.warn.map(w=>`<div class=warn>⚠ ${esc(w)}</div>`).join('')}</div></div>
 <div class=card><h2>2. Impostazioni</h2>
 <label><input type=radio name=m ${s.timed?'checked':''} onchange="H.set.timed=true">Tempo limitato per ogni domanda</label>
 <label><input type=radio name=m ${s.timed?'':'checked'} onchange="H.set.timed=false">Si passa avanti quando tutti hanno risposto</label>
 <label>Secondi: <input type=number min=5 max=300 value=${s.sec} oninput="H.set.sec=Math.max(5,+this.value||20)"> <span class=mut>(limite di tempo, oppure tempo di riferimento per il bonus velocità)</span></label>
 <label><input type=checkbox ${s.speed?'checked':''} onchange="H.set.speed=this.checked">Bonus velocità (da 500 a 1000 punti per risposta giusta; senza bonus: 1000 fissi)</label>
 <label><input type=checkbox ${s.opts?'checked':''} onchange="H.set.opts=this.checked">Mostra domanda e risposte anche sui telefoni (se spento: solo i quadrati A B C D)</label>
 <label><input type=checkbox ${s.shuf?'checked':''} onchange="H.set.shuf=this.checked">Mescola l'ordine delle domande</label></div>
 <button class=btn ${H.qs.length?'':'disabled'} onclick=openRoom()>Apri la stanza ▶</button></div>`)}
function loadF(f){if(!f)return;f.text().then(t=>{const r=parse(t);H.qs=r.qs;H.warn=r.warn;rSetup()})}

function openRoom(){H.phase='lobby';h('<div class=wrap><h1>Creo la stanza…</h1></div>');mkRoom()}
function mkRoom(){
 H.code=Array.from({length:5},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join('');
 const p=H.peer=mkPeer(CFG.prefix+H.code);
 p.on('open',render);
 p.on('connection',c=>{c.on('data',m=>hostMsg(c,m));c.on('close',()=>{for(const q of H.players.values())if(q.conn===c){q.on=false}refresh();checkAll()})});
 p.on('error',e=>{if(e.type==='unavailable-id'){p.destroy();mkRoom()}else h(`<div class=wrap><div class=card><h2 class=err>Connessione al servizio non riuscita (${esc(e.type)})</h2><p>Controlla internet e ricarica la pagina.</p></div></div>`)})}

function hostMsg(c,m){
 if(m.t==='join'){let p=H.players.get(m.pid);const name=String(m.name||'').trim().replace(/\s+/g,' ').slice(0,20);
  if(!p){if(!name)return;if([...H.players.values()].some(q=>q.name.toLowerCase()===name.toLowerCase()))return c.send({t:'err',msg:'Questo nome è già usato, scegline un altro.'});
   p={pid:m.pid,name,score:0,right:0};H.players.set(m.pid,p)}
  p.conn=c;p.on=true;c.send(snap(p));refresh()}
 else if(m.t==='ans'){let p=[...H.players.values()].find(q=>q.conn===c);
  if(!p||H.phase!=='q'||m.q!==H.qi||H.cur.ans.has(p.pid)||!(m.c>=0&&m.c<H.cur.disp.length))return;
  H.cur.ans.set(p.pid,{c:m.c,t:Date.now()-H.cur.t0});c.send(snap(p));refresh();checkAll()}}
function checkAll(){if(H.phase!=='q')return;const on=[...H.players.values()].filter(p=>p.on);if(on.length&&on.every(p=>H.cur.ans.has(p.pid)))closeQ()}

function snap(p){const c=H.cur,b=board(),s={ph:H.phase,n:H.qi+1,tot:H.order.length,name:p.name,score:p.score,rank:b.indexOf(p)+1,np:b.length};
 if(H.phase==='q'||H.phase==='res'){s.k=c.disp.length;s.so=H.set.opts;if(s.so){s.q=c.q.q;s.o=c.disp}
  const a=c.ans.get(p.pid);s.a=a?a.c:-1;
  if(H.phase==='q'&&H.set.timed)s.rem=Math.max(0,c.t0+H.set.sec*1000-Date.now());
  if(H.phase==='res'){s.ok=c.ok;s.pts=c.pts.get(p.pid)||0}}
 return s}
function bcast(){for(const p of H.players.values())if(p.conn&&p.on)try{p.conn.send(snap(p))}catch(e){}}

function startQuiz(){H.order=H.set.shuf?shuf(H.qs):[...H.qs];H.qi=-1;nextQ()}
function nextQ(){clearInterval(H.tm);H.qi++;if(H.qi>=H.order.length)return endQ();
 const q=H.order[H.qi],idx=shuf(q.o.map((_,i)=>i));
 H.cur={q,disp:idx.map(i=>q.o[i]),ok:idx.indexOf(0),ans:new Map(),pts:new Map(),t0:Date.now()};
 H.phase='q';H.lb=0;if(H.set.timed)H.tm=setInterval(tick,250);bcast();render()}
function tick(){const r=H.cur.t0+H.set.sec*1000-Date.now(),e=$('#tm');if(e)e.textContent=Math.max(0,Math.ceil(r/1000));if(r<=0)closeQ()}
function closeQ(){if(H.phase!=='q')return;clearInterval(H.tm);const T=H.set.sec*1000;
 for(const[pid,a]of H.cur.ans)if(a.c===H.cur.ok){const pt=H.set.speed?Math.round(500+500*(1-Math.min(a.t,T)/T)):1000,p=H.players.get(pid);p.score+=pt;p.right++;H.cur.pts.set(pid,pt)}
 H.phase='res';bcast();render()}
function endQ(){clearInterval(H.tm);H.phase='end';bcast();render()}

function lbHtml(n){return `<table class=lb>${board().slice(0,n||999).map((p,i)=>`<tr><td>${i+1}°</td><td>${esc(p.name)}</td><td>${p.score}</td></tr>`).join('')||'<tr><td>Nessun partecipante</td></tr>'}</table>`}
function render(){
 if(H.phase==='lobby'){const url=location.href.split('#')[0].split('?')[0]+'?room='+H.code,n=H.players.size;
  h(`<div class=wrap><div class=row style="align-items:flex-start;gap:24px"><div class=card style="flex:0 0 340px;text-align:center">${qrSvg(url)}<div class=code>${H.code}</div></div>
  <div style="flex:1;min-width:280px"><h1>Entrate nel quiz!</h1><p>Inquadrate il QR code con la fotocamera del telefono, oppure aprite il link:</p>
  <div class=card style="word-break:break-all"><b>${esc(url)}</b></div>
  ${location.protocol==='file:'?'<p class=err>Attenzione: il file è aperto dal computer. Per far entrare gli studenti devi pubblicarlo online (es. GitHub Pages).</p>':''}
  <button class=btn onclick="navigator.clipboard.writeText('${url}').then(()=>this.textContent='Copiato ✓')">Copia link</button>
  <a href="https://wa.me/?text=${encodeURIComponent('Entra nel quiz: '+url)}" target=_blank rel=noopener><button class="btn s">Invia su WhatsApp</button></a></div></div>
  <div class=card><h2>Partecipanti: ${n}</h2><div class=chips>${[...H.players.values()].map(p=>`<span class="chip${p.on?' d':' off'}">${esc(p.name)} <a href=# onclick="H.players.delete('${p.pid}');render();return false" title=Rimuovi style="color:inherit">×</a></span>`).join('')||'<span class=mut>In attesa…</span>'}</div></div>
  <button class=btn ${n?'':'disabled'} onclick=startQuiz()>Avvia il quiz ▶</button></div>`)}
 else if(H.phase==='q'||H.phase==='res'){const c=H.cur,res=H.phase==='res',on=[...H.players.values()],done=on.filter(p=>c.ans.has(p.pid)).length,last=H.qi+1>=H.order.length,
  cnt=c.disp.map((_,i)=>[...c.ans.values()].filter(a=>a.c===i).length);
  h(`<div class=wrap><div class=bar><b>Domanda ${H.qi+1} di ${H.order.length}</b><span id=tm class=tm>${H.set.timed&&!res?Math.max(0,Math.ceil((c.t0+H.set.sec*1000-Date.now())/1000)):''}</span><b>Hanno risposto: ${done}/${on.length}</b></div>
  <div class="card q">${esc(c.q.q)}</div>
  <div class=opts>${c.disp.map((t,i)=>`<div class="opt c${i}${res&&i!==c.ok?' dim':''}${res&&i===c.ok?' ok':''}"><b>${L[i]}</b><span>${esc(t)}</span>${res?`<em>${cnt[i]}</em>`:''}</div>`).join('')}</div>
  <div class=chips>${on.map(p=>`<span class="chip${c.ans.has(p.pid)?' d':''}${p.on?'':' off'}">${esc(p.name)}</span>`).join('')}</div>
  <div class=row>${res?`<button class=btn onclick=nextQ()>${last?'Classifica finale ▶':'Domanda successiva ▶'}</button>`:`<button class=btn onclick=closeQ()>Blocca risposte</button>`}
  <button class="btn s" onclick="H.lb=1;render()">Classifica parziale</button><button class="btn s" onclick="confirm('Terminare il quiz adesso?')&&endQ()">Termina</button></div>
  ${res?`<div class=card><h2>Primi 5</h2>${lbHtml(5)}</div>`:''}
  ${H.lb?`<div class=ov onclick="H.lb=0;render()"><div class=card><h2>Classifica parziale</h2>${lbHtml()}<button class=btn>Chiudi</button></div></div>`:''}</div>`)}
 else if(H.phase==='end'){h(`<div class=wrap><h1>🏆 Classifica finale</h1><div class=card>${board().slice(0,3).map((p,i)=>`<div class=q>${'🥇🥈🥉'[i]} ${esc(p.name)} — ${p.score}</div>`).join('')}</div>
  <div class=card><h2>Tutti i partecipanti</h2>${lbHtml()}</div><button class=btn onclick=csv()>Scarica risultati (CSV)</button><button class="btn s" onclick=location.reload()>Nuovo quiz</button></div>`)}}
function csv(){const r=['Posizione;Nome;Punti;Risposte giuste',...board().map((p,i)=>`${i+1};"${p.name.replace(/"/g,'""')}";${p.score};${p.right}`)].join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\uFEFF'+r],{type:'text/csv'}));a.download='risultati-quiz.csv';a.click()}
function qrSvg(t){try{const q=qrcode(0,'M');q.addData(t);q.make();const n=q.getModuleCount();let d='';
 for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+=`M${c+4},${r+4}h1v1h-1z`;
 return `<svg viewBox="0 0 ${n+8} ${n+8}" style="width:100%;background:#fff;border-radius:12px"><path d="${d}" fill="#000"/></svg>`}catch(e){return ''}}

/* ---------- STUDENTE ---------- */
const ST={room:'',pid:'',name:'',gen:0,peer:null,conn:null,s:null,rt:null,ti:null,ok:false};
function landing(){h(`<div class=st><h1>Quiz in Classe</h1><div class=card><h2>Sono uno studente</h2>
 <p><input type=text id=rc placeholder="Codice stanza" maxlength=5 autocapitalize=characters></p><p><input type=text id=nm placeholder="Il tuo nome" maxlength=20></p>
 <button class=btn onclick="joinForm()">Entra</button></div><button class="btn s" onclick=rSetup()>Sono l'istruttore</button></div>`)}
function joinPage(err){h(`<div class=st><h1>Quiz in Classe</h1><div class=card><h2>Come ti chiami?</h2>${err?`<p class=err>${esc(err)}</p>`:''}
 <p><input type=text id=nm placeholder="Nome e cognome" maxlength=20 value="${esc(ST.name)}"></p><button class=btn onclick="joinForm()">Entra nel quiz</button></div></div>`)}
function joinForm(){const rc=$('#rc'),nm=$('#nm').value.trim();if(rc)ST.room=rc.value.trim().toUpperCase();
 if(!ST.room||!nm)return;ST.name=nm;ST.pid=localStorage.getItem('kq_pid')||('p'+Math.random().toString(36).slice(2,10));
 try{localStorage.setItem('kq_pid',ST.pid);localStorage.setItem('kq_'+ST.room,nm)}catch(e){}
 h('<div class=st><div class=big>Connessione…</div></div>');sConn()}
function sConn(){const g=++ST.gen;clearTimeout(ST.rt);if(ST.peer)try{ST.peer.destroy()}catch(e){}
 const retry=()=>{if(g!==ST.gen)return;ST.ok=false;$('#cn').innerHTML='<div class=conn>Connessione persa… riconnetto</div>';clearTimeout(ST.rt);ST.rt=setTimeout(sConn,2500)};
 const p=ST.peer=mkPeer();
 p.on('open',()=>{if(g!==ST.gen)return;const c=ST.conn=p.connect(CFG.prefix+ST.room,{reliable:true});let o=0;
  c.on('open',()=>{o=1;c.send({t:'join',pid:ST.pid,name:ST.name})});
  c.on('data',m=>{if(g!==ST.gen)return;if(m.t==='err'){ST.gen++;ST.peer.destroy();joinPage(m.msg);return}ST.ok=true;$('#cn').innerHTML='';ST.s=m;sRender()});
  c.on('close',retry);c.on('error',retry);setTimeout(()=>{if(!o)retry()},10000)});
 p.on('error',e=>{if(g!==ST.gen)return;if(e.type==='peer-unavailable')h('<div class=st><div class=big>Stanza non trovata</div><p>Controlla il codice o chiedi all\'istruttore di aprire la stanza. Riprovo da solo…</p></div>');retry()})}
function ans(i){const s=ST.s;if(s.a>=0)return;s.a=i;ST.conn.send({t:'ans',q:s.n-1,c:i});sRender()}
function sRender(){const s=ST.s;clearInterval(ST.ti);
 if(s.ph==='lobby')h(`<div class=st><div class=big>Sei dentro, ${esc(s.name)}!</div><p>Aspetta che l'istruttore avvii il quiz.</p><p class=mut>Partecipanti: ${s.np}</p></div>`);
 else if(s.ph==='q'){
  if(s.a>=0)h(`<div class=st><div class=big>Risposta inviata ✓</div><div class="res c${s.a}"><div style="font-size:4rem;font-weight:800">${L[s.a]}</div>${s.so?esc(s.o[s.a]):''}</div><p>Aspetta gli altri…</p></div>`);
  else{const ks=[...Array(s.k).keys()],end=s.rem!=null?Date.now()+s.rem:0;
   h(`<div class=st style="max-width:700px"><div class=bar><b>Domanda ${s.n}/${s.tot}</b><span id=st class=tm>${end?Math.ceil(s.rem/1000):''}</span></div>
   ${s.so?`<div class="card q" style="font-size:1.35rem">${esc(s.q)}</div><div class=lst>${ks.map(i=>`<button class="o c${i}" onclick=ans(${i})><b>${L[i]}</b><span>${esc(s.o[i])}</span></button>`).join('')}</div>`
    :`<p>Guarda la domanda sullo schermo e scegli:</p><div class=sq>${ks.map(i=>`<button class="o c${i}" onclick=ans(${i})>${L[i]}</button>`).join('')}</div>`}</div>`);
   if(end)ST.ti=setInterval(()=>{const e=$('#st');if(e)e.textContent=Math.max(0,Math.ceil((end-Date.now())/1000))},250)}}
 else if(s.ph==='res'){const r=s.a<0?['#5b6678','Non hai risposto']:s.a===s.ok?['var(--ok)','Giusto! +'+s.pts+' punti']:['var(--ko)','Sbagliato'];

 else if(s.ph==='end')h(`<div class=st><div class=big>Quiz finito!</div><div class=card><div class=big>${s.rank}° posto su ${s.np}</div>${s.score} punti</div></div>`)}
